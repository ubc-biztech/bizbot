services:
  bizbot:
    image: bizbot:local
    build:
      context: .
    env_file:
      - .env
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
