name: autofix.ci

on:
  pull_request:
    branches: [main, dev]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t bizbot:test .
      - name: Import application without external services
        run: |
          docker run --rm --network none \
            -e AWS_ACCESS_KEY_ID=test-key \
            -e AWS_SECRET_ACCESS_KEY=test-secret \
            -e AWS_EC2_METADATA_DISABLED=true \
            bizbot:test python -c "import main; from services.discord.tickets import tickets"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen
      - name: Typecheck
        run: uv run pyright

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check --fix
        run: uv run ruff check --fix .

      - name: Run ruff format
        run: uv run ruff format .

      - name: Commit formatting changes
        uses: autofix-ci/action@v1
        with:
          commit-message: "style: format with ruff"
